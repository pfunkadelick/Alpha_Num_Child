<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ABC & 123</title>
<meta name="description" content="Learn to write letters and numbers by tracing">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ABC & 123">
<meta name="theme-color" content="#8cc6f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<style>
  :root {
    --sky: #8cc6f7;
    --mint: #a8ebc8;
    --paper: #ffffff;
    --ink: #33597f;
    --ink-soft: #6c88a3;
    --track: #d9dce3;
    --gold: #ffcd3c;
    --red: #f2554f;
    --blue: #4d8cf2;
    --green: #4ab877;
    --orange: #f99933;
    --purple: #a86bf0;
    --pink: #f073a6;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--sky);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #app {
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, var(--sky) 0%, var(--mint) 100%);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  .screen.active { display: flex; }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- Home ---------- */
  #screen-home {
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
  }
  .home-title {
    font-size: clamp(40px, 11vw, 56px);
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.7);
    margin: 0;
  }
  .home-title span:nth-child(6n+1) { color: var(--red); }
  .home-title span:nth-child(6n+2) { color: var(--orange); }
  .home-title span:nth-child(6n+3) { color: var(--green); }
  .home-title span:nth-child(6n+4) { color: var(--blue); }
  .home-title span:nth-child(6n+5) { color: var(--purple); }
  .home-title span:nth-child(6n+6) { color: var(--pink); }
  .home-sub {
    font-size: 19px;
    font-weight: 600;
    margin: -8px 0 0;
    color: var(--ink);
  }
  #star-capsule {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.75);
    border-radius: 999px;
    padding: 8px 18px;
    font-weight: 700;
    font-size: 16px;
  }
  #star-capsule .star { color: var(--gold); font-size: 18px; }
  .home-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: min(92vw, 440px);
  }
  .home-card {
    border-radius: 26px;
    padding: 18px 10px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #ffffff;
    box-shadow: 0 6px 14px rgba(30,60,90,0.18);
    transition: transform 0.12s ease;
  }
  .home-card:active { transform: scale(0.96); }
  .home-card .emoji { font-size: 46px; line-height: 1; }
  .home-card .name { font-size: 19px; font-weight: 800; }
  .home-card .tag { font-size: 14px; font-weight: 700; opacity: 0.9; }
  .card-upper { background: linear-gradient(135deg, #ff7370, #ffa04a); }
  .card-lower { background: linear-gradient(135deg, #4ab877, #29a0bd); }
  .card-numbers { background: linear-gradient(135deg, #6b80f2, #a86bf0); }
  .card-words { background: linear-gradient(135deg, #f2ae38, #e66b80); }
  #sticker-card, #doodle-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: min(92vw, 440px);
    border-radius: 24px;
    padding: 14px 20px;
    background: linear-gradient(90deg, #fabf40, #f28c59);
    color: #ffffff;
    box-shadow: 0 6px 14px rgba(30,60,90,0.18);
    text-align: left;
  }
  #sticker-card:active, #doodle-card:active { transform: scale(0.97); }
  #sticker-card .gift, #doodle-card .gift { font-size: 38px; }
  #sticker-card .col, #doodle-card .col { display: flex; flex-direction: column; flex: 1; gap: 2px; }
  #sticker-card .name, #doodle-card .name { font-size: 19px; font-weight: 800; }
  #sticker-card .count, #doodle-card .count { font-size: 14px; font-weight: 700; opacity: 0.9; }
  #sticker-card .chev, #doodle-card .chev { font-size: 26px; font-weight: 800; opacity: 0.8; }
  #doodle-card { background: linear-gradient(90deg, #faa95e, #f5789e); }

  /* ---------- Sticker book ---------- */
  #sticker-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sticker-section-title {
    font-size: 19px;
    font-weight: 800;
    margin: 14px 4px 8px;
  }
  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 10px;
    max-width: 560px;
  }
  .sticker-slot {
    background: rgba(255,255,255,0.5);
    border-radius: 18px;
    height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .sticker-slot.got { background: var(--paper); box-shadow: 0 3px 8px rgba(30,60,90,0.1); }
  .sticker-slot .pic { font-size: 34px; line-height: 1; }
  .sticker-slot .q { font-size: 28px; font-weight: 800; color: var(--track); line-height: 1; }
  .sticker-slot .label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }

  .tile { position: relative; }
  .tile .badge {
    position: absolute;
    top: 5px;
    right: 7px;
    font-size: 15px;
  }

  .home-foot {
    display: flex;
    gap: 14px;
  }
  .foot-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    color: var(--ink);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Shared header ---------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 4px;
  }
  .bar .spacer { flex: 1; }
  .bar-title {
    font-size: 22px;
    font-weight: 800;
  }
  .round-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(30,60,90,0.15);
    flex: none;
  }
  .round-btn:disabled { color: var(--track); }
  .round-btn:active:not(:disabled) { transform: scale(0.92); }

  /* ---------- Grid ---------- */
  #grid-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
  }
  #grid-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 12px;
    max-width: 560px;
    margin: 0 auto;
  }
  .tile {
    background: var(--paper);
    border-radius: 20px;
    height: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 4px 10px rgba(30,60,90,0.12);
  }
  .tile:active { transform: scale(0.94); }
  .tile .glyph {
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
  }
  .tile .stars { font-size: 11px; letter-spacing: 2px; }
  .tile .stars .on { color: var(--gold); }
  .tile .stars .off { color: var(--track); }

  /* ---------- Trace ---------- */
  #screen-trace { align-items: center; }
  #trace-progress {
    display: flex;
    gap: 6px;
    padding: 6px 0 2px;
    min-height: 10px;
  }
  #trace-progress .pip {
    width: 30px;
    height: 8px;
    border-radius: 999px;
    background: var(--track);
  }
  #trace-progress .pip.done { background: var(--green); }
  .canvas-wrap {
    position: relative;
    width: min(92vw, 62vh, 520px);
    aspect-ratio: 1;
    margin: 8px 0;
  }
  .paper-card {
    position: absolute;
    inset: 0;
    background: var(--paper);
    border-radius: 30px;
    box-shadow: 0 8px 20px rgba(30,60,90,0.16);
  }
  canvas.fill {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 30px;
    touch-action: none;
  }
  #trace-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 0 14px;
  }
  .big-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffffff;
    font-size: 17px;
    font-weight: 800;
    border-radius: 999px;
    padding: 14px 24px;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    box-shadow: 0 4px 10px rgba(30,60,90,0.2);
  }
  .big-btn:active { transform: scale(0.95); }

  /* ---------- Celebration ---------- */
  #celebrate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    background: rgba(20, 40, 60, 0.35);
    z-index: 30;
  }
  #celebrate.active { display: flex; }
  #confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #celebrate .big-star {
    font-size: 110px;
    line-height: 1;
    filter: drop-shadow(0 0 18px rgba(255,180,40,0.8));
    animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  @keyframes pop { from { transform: scale(0.2); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    #celebrate .big-star { animation: none; }
    .home-card, .round-btn, .big-btn, .tile { transition: none; }
  }
  #celebrate .praise {
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    margin: 0;
    text-align: center;
    padding: 0 24px;
  }
  #celebrate .big-star.many { font-size: 44px; text-align: center; max-width: 320px; line-height: 1.2; }
  #celebrate .new-sticker {
    font-size: 17px;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    margin: -4px 0 0;
  }
  #celebrate .row { display: flex; gap: 14px; }
  .cele-btn {
    font-size: 17px;
    font-weight: 800;
    border-radius: 999px;
    padding: 14px 26px;
  }
  #btn-again { background: var(--paper); color: var(--ink); }
  #btn-next-cele { background: var(--green); color: #ffffff; }

  /* ---------- Doodle ---------- */
  #screen-doodle { align-items: center; }
  #doodle-palette {
    display: flex;
    gap: 10px;
    padding: 6px 0;
  }
  .swatch {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 3px solid transparent;
    box-shadow: 0 2px 6px rgba(30,60,90,0.2);
    transition: transform 0.15s ease;
  }
  .swatch.selected { border-color: #ffffff; transform: scale(1.2); }
  #doodle-actions { display: flex; gap: 14px; padding: 4px 0 14px; }
  .pill-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 999px;
    padding: 12px 20px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 3px 8px rgba(30,60,90,0.15);
  }
  .pill-btn.danger { background: var(--red); color: #ffffff; }
  .pill-btn:active { transform: scale(0.95); }
</style>

<div id="app">

  <!-- Home -->
  <section class="screen active" id="screen-home">
    <h1 class="home-title" id="home-title"></h1>
    <p class="home-sub">Let's learn to write!</p>
    <div id="star-capsule"><span class="star">&#9733;</span><span id="star-count"></span></div>
    <div class="home-grid">
      <button class="home-card card-upper" data-cat="uppercase">
        <span class="emoji">&#127344;&#65039;</span><span class="name">Big Letters</span><span class="tag">ABC</span>
      </button>
      <button class="home-card card-lower" data-cat="lowercase">
        <span class="emoji">&#9997;&#65039;</span><span class="name">Small Letters</span><span class="tag">abc</span>
      </button>
      <button class="home-card card-numbers" data-cat="numbers">
        <span class="emoji">&#128290;</span><span class="name">Numbers</span><span class="tag">123</span>
      </button>
      <button class="home-card card-words" data-cat="words">
        <span class="emoji">&#128214;</span><span class="name">Little Words</span><span class="tag">cat &#183; dog</span>
      </button>
    </div>
    <button id="doodle-card">
      <span class="gift">&#128396;&#65039;</span>
      <span class="col">
        <span class="name">Doodle</span>
        <span class="count">Free drawing pad</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <button id="sticker-card">
      <span class="gift">&#127873;</span>
      <span class="col">
        <span class="name">Sticker Book</span>
        <span class="count" id="sticker-count"></span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <div class="home-foot">
      <button class="foot-btn" id="btn-sound" aria-label="Toggle sound"></button>
      <button class="foot-btn" id="btn-reset" aria-label="Reset stars">&#9881;&#65039;</button>
    </div>
  </section>

  <!-- Character grid -->
  <section class="screen" id="screen-grid">
    <div class="bar">
      <button class="round-btn" id="btn-grid-back" aria-label="Back">&#8592;</button>
      <span class="bar-title" id="grid-title"></span>
      <span class="spacer"></span>
    </div>
    <div id="grid-scroll"><div id="grid-tiles"></div></div>
  </section>

  <!-- Tracing -->
  <section class="screen" id="screen-trace">
    <div class="bar" style="width:100%">
      <button class="round-btn" id="btn-trace-back" aria-label="Back">&#8592;</button>
      <span class="spacer"></span>
      <span class="bar-title" id="trace-glyph" style="font-size:30px"></span>
      <span class="spacer"></span>
      <button class="round-btn" id="btn-prev" aria-label="Previous">&#8249;</button>
      <button class="round-btn" id="btn-next" aria-label="Next">&#8250;</button>
    </div>
    <div id="trace-progress"></div>
    <div class="canvas-wrap">
      <div class="paper-card"></div>
      <canvas class="fill" id="trace-canvas"></canvas>
    </div>
    <div id="trace-controls">
      <button class="round-btn" id="btn-restart" aria-label="Start over">&#8634;</button>
      <button class="big-btn" id="btn-demo">&#10024; Show me</button>
    </div>
  </section>

  <!-- Sticker book -->
  <section class="screen" id="screen-stickers">
    <div class="bar">
      <button class="round-btn" id="btn-stickers-back" aria-label="Back">&#8592;</button>
      <span class="bar-title">Sticker Book</span>
      <span class="spacer"></span>
    </div>
    <div id="sticker-scroll"></div>
  </section>

  <!-- Doodle -->
  <section class="screen" id="screen-doodle">
    <div class="bar" style="width:100%">
      <button class="round-btn" id="btn-doodle-back" aria-label="Back">&#8592;</button>
      <span class="bar-title">Doodle</span>
      <span class="spacer"></span>
    </div>
    <div class="canvas-wrap">
      <div class="paper-card"></div>
      <canvas class="fill" id="doodle-canvas"></canvas>
    </div>
    <div id="doodle-palette"></div>
    <div id="doodle-actions">
      <button class="pill-btn" id="btn-undo">&#8617; Undo</button>
      <button class="pill-btn danger" id="btn-clear">&#128465; Clear</button>
    </div>
  </section>

  <!-- Celebration overlay -->
  <div id="celebrate">
    <canvas id="confetti-canvas"></canvas>
    <div class="big-star" id="reward-display">&#11088;</div>
    <p class="praise" id="reward-phrase">Great job!</p>
    <p class="new-sticker" id="new-sticker">&#10024; New sticker collected!</p>
    <div class="row">
      <button class="cele-btn" id="btn-again">&#8634; Again</button>
      <button class="cele-btn" id="btn-next-cele">Next &#8594;</button>
    </div>
  </div>
</div>

// Simple two- and three-letter words, built by laying the lowercase
// letter strokes side by side. Each word pairs with a picture.
const WORD_ENTRIES = [
  ["up", "⬆️"], ["go", "🚦"], ["me", "🙋"], ["no", "🙅"], ["hi", "👋"], ["ox", "🐂"],
  ["cat", "🐱"], ["dog", "🐶"], ["sun", "☀️"], ["bus", "🚌"], ["hat", "🎩"],
  ["pig", "🐷"], ["cow", "🐮"], ["bee", "🐝"], ["car", "🚗"], ["egg", "🥚"],
  ["cup", "☕"], ["bed", "🛏️"], ["fox", "🦊"], ["owl", "🦉"],
];
DATA.words = WORD_ENTRIES.map(([word, emoji]) => {
  // Letters overlap their slots' side padding (pitch < scale) so the
  // word reads tightly and each letter can render a bit larger.
  const n = word.length;
  const s = 0.98 / (1 + 0.78 * (n - 1));
  const pitch = 0.78 * s;
  const xStart = (1 - (s + pitch * (n - 1))) / 2;
  const dy = (1 - s) / 2;
  const strokes = [], letterEnds = [];
  for (let i = 0; i < n; i++) {
    const letter = DATA.lowercase.find(c => c.g === word[i]);
    const dx = xStart + i * pitch;
    for (const st of letter.strokes) {
      if (st.dot) strokes.push({ dot: [dx + st.dot[0] * s, dy + st.dot[1] * s] });
      else strokes.push(st.map(p => [dx + p[0] * s, dy + p[1] * s]));
    }
    letterEnds.push(strokes.length);
  }
  letterEnds.pop();   // the final letter is announced by the praise
  return { id: "W-" + word, g: word, say: "the word " + word, strokes,
           word, emoji, letterEnds, f: Math.min(1, s + 0.25),
           guides: [0.15, 0.42, 0.78].map(y => dy + y * s) };
});

  V: ["🎻", "violin"],   W: ["🐳", "whale"],    X: ["🩻", "x-ray"],
  Y: ["🪀", "yo-yo"],    Z: ["🦓", "zebra"],
};
const NUMBER_REWARDS = [
  ["🍩", "donut", "donuts"], ["🚀", "rocket", "rockets"], ["🦆", "duck", "ducks"],
  ["🍎", "apple", "apples"], ["🐸", "frog", "frogs"], ["⭐", "star", "stars"],
  ["🐠", "fish", "fish"], ["🎈", "balloon", "balloons"], ["🍪", "cookie", "cookies"],
  ["🐞", "ladybug", "ladybugs"],
];

function rewardFor(ch) {
  if (ch.word) {
    // Commas give the voice a small pause between letter names.
    const spelling = ch.word.toUpperCase().split("").join(", ");
    return { display: ch.emoji, sticker: ch.emoji,
             phrase: spelling + ", spells " + ch.word + "!" };
  }
  if (ch.id.startsWith("N-")) {
    const n = parseInt(ch.g, 10);
    const [emoji, singular, plural] = NUMBER_REWARDS[n];
    if (n === 0) {
      return { display: emoji, sticker: emoji,
               phrase: "Zero looks like a donut — zero means none!" };
    }
    const word = n === 1 ? singular : plural;
    const name = ch.say.charAt(0).toUpperCase() + ch.say.slice(1);
    return { display: emoji.repeat(n), sticker: emoji, phrase: name + " " + word + "!" };
  }
  const [emoji, word] = LETTER_REWARDS[ch.g.toUpperCase()] || ["⭐", "star"];
  return { display: emoji, sticker: emoji, phrase: ch.g + " is for " + word + "!" };
}

// ---------------------------------------------------------------- storage
// localStorage can throw in sandboxed/private contexts; fall back to memory.
const mem = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} mem[k] = v; }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} delete mem[k]; }

const store = {
  get stars() { try { return JSON.parse(lsGet("stars") || "{}"); } catch { return {}; } },
  starsFor(id) { return this.stars[id] || 0; },
  award(id) {
    const s = this.stars;
    s[id] = Math.min(3, (s[id] || 0) + 1);
    lsSet("stars", JSON.stringify(s));
  },
  resetStars() { lsDel("stars"); lsDel("stickers"); },
  get total() { return Object.values(this.stars).reduce((a, b) => a + b, 0); },
  get stickers() { try { return JSON.parse(lsGet("stickers") || "[]"); } catch { return []; } },
  hasSticker(id) { return this.stickers.includes(id); },
  collect(id) {
    const s = this.stickers;
    if (!s.includes(id)) { s.push(id); lsSet("stickers", JSON.stringify(s)); }
  },
  get soundOn() { return lsGet("soundOn") !== "0"; },
  set soundOn(v) { lsSet("soundOn", v ? "1" : "0"); },
};

// ---------------------------------------------------------------- trace sound
// Continuous audio guidance while tracing — an audio "heat map":
// on the line, a warm tone climbs a pentatonic scale with progress;
// off the line, a soft low wobble grows louder the farther the finger
// strays and fades as it comes back. Synthesized live with Web Audio.
const sound = {
  ctx: null,
  scale: [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5], // C major pentatonic
  // A looping silent <audio> element promotes the page to media-playback
  // audio on iOS, so the guidance tones play even with the silent switch
  // on (speech already does; without this, only the tones went missing).
  silentWavURI() {
    const rate = 8000, n = rate / 2;
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE");
    w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    let bin = "";
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return "data:audio/wav;base64," + btoa(bin);
  },
  ensure() {
    if (!store.soundOn) return false;
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        this.ctx = new AC();

        this.unmute = new Audio(this.silentWavURI());
        this.unmute.loop = true;
        this.unmute.setAttribute("playsinline", "");
        const played = this.unmute.play();
        if (played && played.catch) played.catch(() => {});

        this.goodOsc = this.ctx.createOscillator();
        this.goodOsc.type = "sine";
        this.goodOsc.frequency.value = this.scale[0];
        this.goodGain = this.ctx.createGain();
        this.goodGain.gain.value = 0;
        this.goodOsc.connect(this.goodGain).connect(this.ctx.destination);
        this.goodOsc.start();

        this.warnOsc = this.ctx.createOscillator();
        this.warnOsc.type = "triangle";
        this.warnOsc.frequency.value = 165;
        this.warnGain = this.ctx.createGain();
        this.warnGain.gain.value = 0;
        const tremolo = this.ctx.createGain();
        tremolo.gain.value = 0.65;
        this.warnOsc.connect(tremolo);
        tremolo.connect(this.warnGain).connect(this.ctx.destination);
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 7;
        const lfoDepth = this.ctx.createGain();
        lfoDepth.gain.value = 0.35;
        lfo.connect(lfoDepth).connect(tremolo.gain);
        lfo.start();
        this.warnOsc.start();
      } catch {
        this.ctx = null;
        return false;
      }
    }
    if (this.ctx.state !== "running") {   // suspended or interrupted (iOS)
      const p = this.ctx.resume();
      if (p && p.catch) p.catch(() => {});
    }
    if (this.unmute && this.unmute.paused) {
      const p = this.unmute.play();
      if (p && p.catch) p.catch(() => {});
    }
    return true;
  },
  // d: distance from where the finger should be; tol: on-track threshold;
  // ratio: 0-1 progress along the stroke for the rising melody.
  update(d, tol, ratio) {
    if (!this.ensure()) return;
    const t = this.ctx.currentTime;
    if (d <= tol) {
      const idx = Math.max(0, Math.min(this.scale.length - 1,
                                       Math.floor(ratio * this.scale.length)));
      this.goodOsc.frequency.setTargetAtTime(this.scale[idx], t, 0.02);
      this.goodGain.gain.setTargetAtTime(0.16, t, 0.03);
      this.warnGain.gain.setTargetAtTime(0, t, 0.05);
    } else {
      const excess = Math.min(1, (d - tol) / 0.3);
      this.goodGain.gain.setTargetAtTime(0, t, 0.05);
      this.warnGain.gain.setTargetAtTime(0.05 + 0.22 * excess, t, 0.03);
    }
  },
  release() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.goodGain.gain.setTargetAtTime(0, t, 0.06);
    this.warnGain.gain.setTargetAtTime(0, t, 0.06);
  },
  chime() {
    if (!this.ensure()) return;
    const t = this.ctx.currentTime;
    this.warnGain.gain.setTargetAtTime(0, t, 0.02);
    this.goodOsc.frequency.setValueAtTime(783.99, t);
    this.goodOsc.frequency.setValueAtTime(1046.5, t + 0.09);
    this.goodGain.gain.setValueAtTime(0.2, t);
    this.goodGain.gain.setTargetAtTime(0, t + 0.18, 0.08);
  },
};

// ---------------------------------------------------------------- speech
// Pick the warmest, most natural English voice the device offers.
// Premium/enhanced/natural voices beat the default compact one; well-liked
// warm voices (Ava, Samantha, ...) rank highest. If a nicer voice is
// downloaded later (iOS: Settings > Accessibility > Spoken Content >
// Voices), the voiceschanged event re-picks automatically.
let coachVoice = null;
// Known warm female voices (Apple, Google, Microsoft), best first.
const FEMALE_VOICES = ["ava", "samantha", "zoe", "allison", "susan", "nicky",
                       "serena", "kate", "karen", "moira", "tessa", "martha",
                       "fiona", "veena", "victoria", "kathy", "aria", "jenny",
                       "michelle", "libby", "sonia", "natasha",
                       "google us english", "google uk english female"];
// Known male voices — never picked while any female English voice exists.
const MALE_VOICES = ["aaron", "alex", "arthur", "daniel", "fred", "gordon",
                     "reed", "rocko", "eddy", "albert", "bruce", "junior",
                     "ralph", "grandpa", "oliver", "thomas", "guy", "david",
                     "mark", "james", "ryan", "google uk english male"];
function pickVoice() {
  let best = null, bestScore = -Infinity;
  for (const v of speechSynthesis.getVoices()) {
    if (!v.lang || !v.lang.toLowerCase().startsWith("en")) continue;
    const name = v.name.toLowerCase();
    let s = 0;
    const fi = FEMALE_VOICES.findIndex(p => name.includes(p));
    if (fi >= 0) s += 30 + (FEMALE_VOICES.length - fi);
    if (MALE_VOICES.some(p => name.includes(p))) s -= 60;
    if (name.includes("premium")) s += 15;
    if (name.includes("enhanced")) s += 10;
    if (name.includes("natural")) s += 8;
    if (v.lang.toLowerCase().startsWith("en-us")) s += 4;
    if (v.localService) s += 1;
    if (s > bestScore) { bestScore = s; best = v; }
  }
  coachVoice = best;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  // Safari often loads the voice list only after a user gesture.
  document.addEventListener("pointerdown", pickVoice, { once: true });
}

function say(text) {
  if (!store.soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  if (!coachVoice) pickVoice();   // the voice list may have loaded late
  // Queue one utterance per sentence, so "You wrote C! C is for cat!"
  // gets a natural breath between the sentences.
  const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
  for (const sentence of sentences) {
    const trimmed = sentence.trim();
    if (!trimmed) continue;
    const u = new SpeechSynthesisUtterance(trimmed);
    u.lang = "en-US";
    if (coachVoice) {
      u.voice = coachVoice;
      u.lang = coachVoice.lang;
    }
    // Near-natural pitch and a soothing, unhurried pace — a big pitch
    // boost is what makes synthesized speech sound robotic.
    u.rate = 0.92;
    u.pitch = 1.02;
    speechSynthesis.speak(u);
  }
}
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// ---------------------------------------------------------------- stroke prep
function prepStroke(raw) {
  if (raw.dot) return { dot: true, cx: raw.dot[0], cy: raw.dot[1], length: 0 };
  const pts = raw;
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  return { dot: false, pts, cum, length: cum[cum.length - 1] };
}
function pointAt(stroke, d) {
  const { pts, cum } = stroke;
  d = Math.max(0, Math.min(d, stroke.length));
  for (let i = 1; i < pts.length; i++) {
    if (cum[i] >= d) {
      const seg = cum[i] - cum[i - 1];
      if (seg <= 0) return pts[i];
      const t = (d - cum[i - 1]) / seg;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t,
              pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
    }
  }
  return pts[pts.length - 1];
}

// ---------------------------------------------------------------- engine
const TOL = 0.12, START_TOL = 0.16, MAX_ADVANCE = 0.17;

class TraceEngine {
  constructor(ch) {
    this.ch = ch;
    // Words draw their letters smaller, so all tolerances scale down.
    this.f = ch.f || 1;
    this.strokes = ch.strokes.map(prepStroke);
    this.reset();
  }
  reset() {
    this.idx = 0;
    this.progress = 0;
    this.started = false;
    this.completed = false;
    this.demo = null;       // {base, dist}
  }
  get current() { return this.idx < this.strokes.length ? this.strokes[this.idx] : null; }

  touch(x, y) {
    if (this.completed) return;
    this.stopDemo();
    const s = this.current;
    if (!s) return;
    const f = this.f;
    if (s.dot) {
      const d = Math.hypot(x - s.cx, y - s.cy);
      sound.update(d, START_TOL * f, 0.5);
      if (d < START_TOL * f) this.finishStroke();
      return;
    }
    if (!this.started) {
      const st = s.pts[0];
      const d = Math.hypot(x - st[0], y - st[1]);
      sound.update(d, START_TOL * f, 0);
      if (d >= START_TOL * f) return;
      this.started = true;
    }
    const hit = this.project(x, y, s, Math.max(0, this.progress - 0.06 * f), this.progress + MAX_ADVANCE * f);
    if (hit) {
      const ratio = s.length > 0 ? Math.min(1, this.progress / s.length) : 0;
      sound.update(hit.d, TOL * f, ratio);
      if (hit.d <= TOL * f && hit.s > this.progress) this.progress = hit.s;
    }
    if (this.progress >= s.length - 0.035 * f) this.finishStroke();
  }
  touchEnd() {
    sound.release();
    if (this.completed || !this.started) return;
    const s = this.current;
    if (!s || s.dot) return;
    if (s.length - this.progress < Math.max(0.1 * this.f, s.length * 0.12)) this.finishStroke();
  }
  finishStroke() {
    this.progress = 0;
    this.started = false;
    this.idx++;
    sound.chime();
    if (this.idx >= this.strokes.length) {
      this.completed = true;
      this.onCompleted && this.onCompleted();
    } else {
      buzz(20);
      this.onStrokeDone && this.onStrokeDone(this.idx);
    }
  }
  // Returns {s, d}: arc-length position and distance to the path.
  // The caller applies the tolerance; the distance drives audio guidance.
  project(x, y, s, w0, w1) {
    let best = null;
    for (let i = 0; i < s.pts.length - 1; i++) {
      const a0 = s.cum[i], a1 = s.cum[i + 1], seg = a1 - a0;
      if (seg <= 0 || a1 < w0 || a0 > w1) continue;
      const ax = s.pts[i][0], ay = s.pts[i][1];
      const bx = s.pts[i + 1][0] - ax, by = s.pts[i + 1][1] - ay;
      let t = ((x - ax) * bx + (y - ay) * by) / (seg * seg);
      const tMin = Math.max(0, (w0 - a0) / seg), tMax = Math.min(1, (w1 - a0) / seg);
      t = Math.min(Math.max(t, tMin), tMax);
      const d = Math.hypot(x - (ax + bx * t), y - (ay + by * t));
      if (!best || d < best.d) best = { s: a0 + seg * t, d };
    }
    return best;
  }

  // demo
  startDemo() {
    if (this.completed) return;
    this.demo = { base: this.idx, dist: 0 };
  }
  stopDemo() { this.demo = null; }
  demoLen(i) { return Math.max(this.strokes[i].length, 0.08); }
  demoTotal() {
    let t = 0;
    for (let i = this.demo.base; i < this.strokes.length; i++) t += this.demoLen(i);
    return t;
  }
  tickDemo(dt) {
    if (!this.demo) return;
    this.demo.dist += 0.55 * Math.max(this.f, 0.6) * dt;
    if (this.demo.dist >= this.demoTotal() + 0.25) this.demo = null;
  }
  demoInk(i) {
    if (!this.demo || i < this.demo.base) return 0;
    let off = 0;
    for (let k = this.demo.base; k < i; k++) off += this.demoLen(k);
    return Math.min(Math.max(this.demo.dist - off, 0), this.strokes[i].length);
  }
  demoReached(i) {
    if (!this.demo || i < this.demo.base) return false;
    let off = 0;
    for (let k = this.demo.base; k < i; k++) off += this.demoLen(k);
    return this.demo.dist - off > 0.04;
  }
  demoPencil() {
    if (!this.demo) return null;
    let off = 0;
    for (let i = this.demo.base; i < this.strokes.length; i++) {
      const l = this.demoLen(i);
      if (this.demo.dist <= off + l) {
        const s = this.strokes[i];
        return s.dot ? [s.cx, s.cy] : pointAt(s, this.demo.dist - off);
      }
      off += l;
    }
    return null;
  }
}

// ---------------------------------------------------------------- trace
function openTrace(i) {
  currentIdx = i;
  const ch = DATA[currentCat][i];
  engine = new TraceEngine(ch);
  engine.onCompleted = onTraceComplete;
  // In word mode, name each letter as it's completed.
  engine.onStrokeDone = (idx) => {
    if (ch.letterEnds && ch.letterEnds.includes(idx)) {
      const li = ch.letterEnds.indexOf(idx);
      say(ch.word[li].toUpperCase() + "!");
    }
  };
  $("trace-glyph").textContent = ch.g;
  $("trace-glyph").style.fontSize = ch.g.length > 1 ? "24px" : "30px";
  $("trace-glyph").style.color = CRAYONS[i % CRAYONS.length];
  $("btn-prev").disabled = i === 0;
  $("btn-next").disabled = i === DATA[currentCat].length - 1;
  renderPips();
  hideCelebrate();
  showScreen("trace");
  sizeTraceCanvas();
  requestAnimationFrame(sizeTraceCanvas);
  const invite = INVITATIONS[Math.floor(Math.random() * INVITATIONS.length)];
  say(invite.replace("{}", ch.say));
  setTimeout(() => engine && engine.startDemo(), 500);
}
function renderPips() {
  const wrap = $("trace-progress");
  wrap.innerHTML = "";
  engine.strokes.forEach((_, i) => {
    const p = document.createElement("span");
    p.className = "pip" + (i < engine.idx || engine.completed ? " done" : "");
    wrap.appendChild(p);
  });
}
function onTraceComplete() {
  buzz([30, 40, 30]);
  const ch = DATA[currentCat][currentIdx];
  const reward = rewardFor(ch);
  const isNew = !store.hasSticker(ch.id);
  store.award(ch.id);
  store.collect(ch.id);
  say(PRAISES[Math.floor(Math.random() * PRAISES.length)] +
      " You wrote " + ch.say + "! " + reward.phrase);
  renderPips();
  setTimeout(() => showCelebrate(reward, isNew), 550);
}
function showCelebrate(reward, isNew) {
  celebrateStart = performance.now();
  const disp = $("reward-display");
  disp.textContent = reward.display;
  disp.classList.toggle("many", [...reward.display].length > 4);
  disp.style.animation = "none";
  void disp.offsetWidth;               // restart the pop animation
  disp.style.animation = "";
  $("reward-phrase").textContent = reward.phrase;
  $("new-sticker").style.display = isNew ? "" : "none";
  $("btn-next-cele").style.display =
    currentIdx < DATA[currentCat].length - 1 ? "" : "none";
  $("celebrate").classList.add("active");
  sizeConfetti();
}
function hideCelebrate() { $("celebrate").classList.remove("active"); }

$("btn-trace-back").addEventListener("click", () => { hideCelebrate(); openGrid(currentCat); });
$("btn-prev").addEventListener("click", () => { if (currentIdx > 0) openTrace(currentIdx - 1); });
$("btn-next").addEventListener("click", () => {
  if (currentIdx < DATA[currentCat].length - 1) openTrace(currentIdx + 1);
});
$("btn-restart").addEventListener("click", () => {
  engine.reset(); renderPips(); hideCelebrate(); engine.startDemo();
});
$("btn-demo").addEventListener("click", () => engine.startDemo());
$("btn-again").addEventListener("click", () => {
  hideCelebrate(); engine.reset(); renderPips(); engine.startDemo();
});
$("btn-next-cele").addEventListener("click", () => {
  hideCelebrate();
  if (currentIdx < DATA[currentCat].length - 1) openTrace(currentIdx + 1);
});

// ---------------------------------------------------------------- trace canvas
const traceCanvas = $("trace-canvas");
const tctx = traceCanvas.getContext("2d");

function sizeTraceCanvas() {
  const r = traceCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  traceCanvas.width = Math.round(r.width * dpr);
  traceCanvas.height = Math.round(r.height * dpr);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", () => {
  if ($("screen-trace").classList.contains("active")) sizeTraceCanvas();
  if ($("screen-doodle").classList.contains("active")) sizeDoodle();
  if ($("celebrate").classList.contains("active")) sizeConfetti();
});

function letterRect() {
  const w = traceCanvas.getBoundingClientRect().width;
  const side = w * 0.82, off = (w - side) / 2;
  return { x: off, y: off, s: side };
}
const mapX = (r, x) => r.x + x * r.s;
const mapY = (r, y) => r.y + y * r.s;

function strokePath(ctx, r, s, upTo) {
  ctx.beginPath();
  ctx.moveTo(mapX(r, s.pts[0][0]), mapY(r, s.pts[0][1]));
  for (let i = 1; i < s.pts.length; i++) {
    if (upTo != null && s.cum[i] > upTo) {
      const p = pointAt(s, upTo);
      ctx.lineTo(mapX(r, p[0]), mapY(r, p[1]));
      return;
    }
    ctx.lineTo(mapX(r, s.pts[i][0]), mapY(r, s.pts[i][1]));
  }
}

function drawTrace(now) {
  const r = letterRect();
  const w = traceCanvas.getBoundingClientRect().width;
  const f = engine.f;
  tctx.clearRect(0, 0, w, w);

  // guide lines (words carry their own, scaled into the word band)
  const guides = engine.ch.guides || CATEGORIES[currentCat].guides;
  guides.forEach((gy, i) => {
    tctx.strokeStyle = "rgba(120,160,205," + (i === 1 ? 0.5 : 0.7) + ")";
    tctx.lineWidth = 1.5;
    tctx.setLineDash(i === 1 ? [6, 6] : []);
    tctx.beginPath();
    tctx.moveTo(r.x - r.s * 0.04, mapY(r, gy));
    tctx.lineTo(r.x + r.s * 1.04, mapY(r, gy));
    tctx.stroke();
  });
  tctx.setLineDash([]);

  const trackW = r.s * 0.13 * f, inkW = r.s * 0.105 * f;
  tctx.lineCap = tctx.lineJoin = "round";

  // gray track
  for (const s of engine.strokes) {
    if (s.dot) {
      tctx.fillStyle = "#d9dce3";
      tctx.beginPath();
      tctx.arc(mapX(r, s.cx), mapY(r, s.cy), trackW * 0.45, 0, 7);
      tctx.fill();
    } else {
      tctx.strokeStyle = "#d9dce3";
      tctx.lineWidth = trackW;
      strokePath(tctx, r, s);
      tctx.stroke();
    }
  }
  // dashed white centerline
  tctx.strokeStyle = "rgba(255,255,255,0.9)";
  tctx.lineWidth = Math.max(1.5, r.s * 0.008);
  tctx.setLineDash([r.s * 0.02, r.s * 0.035]);
  for (const s of engine.strokes) {
    if (s.dot) continue;
    strokePath(tctx, r, s);
    tctx.stroke();
  }
  tctx.setLineDash([]);

  // demo ink
  if (engine.demo) {
    tctx.strokeStyle = "rgba(77,140,242,0.3)";
    tctx.fillStyle = "rgba(77,140,242,0.3)";
    for (let i = engine.demo.base; i < engine.strokes.length; i++) {
      const s = engine.strokes[i];
      const covered = engine.demoInk(i);
      if (s.dot ? !engine.demoReached(i) : covered <= 0) continue;
      if (s.dot) {
        tctx.beginPath();
        tctx.arc(mapX(r, s.cx), mapY(r, s.cy), inkW * 0.45, 0, 7);
        tctx.fill();
      } else {
        tctx.lineWidth = inkW;
        strokePath(tctx, r, s, covered);
        tctx.stroke();
      }
    }
  }

  // finished strokes
  for (let i = 0; i < engine.idx && i < engine.strokes.length; i++) {
    const s = engine.strokes[i];
    tctx.strokeStyle = tctx.fillStyle = CRAYONS[i % CRAYONS.length];
    if (s.dot) {
      tctx.beginPath();
      tctx.arc(mapX(r, s.cx), mapY(r, s.cy), inkW * 0.45, 0, 7);
      tctx.fill();
    } else {
      tctx.lineWidth = inkW;
      strokePath(tctx, r, s);
      tctx.stroke();
    }
  }

  // in-progress ink
  if (!engine.completed && engine.progress > 0 && engine.current && !engine.current.dot) {
    tctx.strokeStyle = CRAYONS[engine.idx % CRAYONS.length];
    tctx.lineWidth = inkW;
    strokePath(tctx, r, engine.current, engine.progress);
    tctx.stroke();
  }

  // direction chevrons along the rest of the current stroke
  if (!engine.completed && engine.current && !engine.current.dot) {
    const s = engine.current;
    const size = r.s * 0.022 * f;
    tctx.strokeStyle = "rgba(115,153,199,0.9)";
    tctx.lineWidth = Math.max(1.5, r.s * 0.012 * f);
    tctx.lineCap = tctx.lineJoin = "round";
    for (let d = Math.max(engine.progress, 0) + 0.08 * f; d < s.length - 0.03; d += 0.11 * f) {
      const p = pointAt(s, d);
      const a = pointAt(s, Math.min(d + 0.02, s.length));
      const b = pointAt(s, Math.max(d - 0.02, 0));
      let dx = a[0] - b[0], dy = a[1] - b[1];
      const len = Math.max(Math.hypot(dx, dy), 1e-4);
      dx /= len; dy /= len;
      const nx = -dy, ny = dx;
      const cx = mapX(r, p[0]), cy = mapY(r, p[1]);
      tctx.beginPath();
      tctx.moveTo(cx - dx * size * 0.4 + nx * size, cy - dy * size * 0.4 + ny * size);
      tctx.lineTo(cx + dx * size, cy + dy * size);
      tctx.lineTo(cx - dx * size * 0.4 - nx * size, cy - dy * size * 0.4 - ny * size);
      tctx.stroke();
    }
  }

  // start bubbles
  if (!engine.completed) {
    for (let i = engine.idx; i < engine.strokes.length; i++) {
      const s = engine.strokes[i];
      const p = s.dot ? [s.cx, s.cy] : s.pts[0];
      const isCur = i === engine.idx;
      const pulse = isCur ? 1 + 0.18 * Math.sin(now / 320) : 1;
      const rad = r.s * (isCur ? 0.045 : 0.035) * pulse * Math.max(f, 0.55);
      tctx.fillStyle = isCur ? "#4ab877" : "#b9bfc9";
      tctx.beginPath();
      tctx.arc(mapX(r, p[0]), mapY(r, p[1]), rad, 0, 7);
      tctx.fill();
      tctx.fillStyle = "#ffffff";
      tctx.font = "800 " + rad * 1.1 + "px ui-rounded, system-ui, sans-serif";
      tctx.textAlign = "center";
      tctx.textBaseline = "middle";
      tctx.fillText(String(i + 1), mapX(r, p[0]), mapY(r, p[1]) + rad * 0.05);
    }
  }

  // demo pencil
  const pencil = engine.demoPencil && engine.demoPencil();
  if (pencil) {
    const pf = Math.max(f, 0.6);
    tctx.font = (r.s * 0.14 * pf) + "px system-ui";
    tctx.textAlign = "center";
    tctx.textBaseline = "middle";
    tctx.fillText("✏️", mapX(r, pencil[0]) + r.s * 0.05 * pf, mapY(r, pencil[1]) - r.s * 0.05 * pf);
  }
}

// touch input
function canvasUnit(e) {
  const rect = traceCanvas.getBoundingClientRect();
  const r = letterRect();
  return [((e.clientX - rect.left) - r.x) / r.s, ((e.clientY - rect.top) - r.y) / r.s];
}
let tracing = false;
traceCanvas.addEventListener("pointerdown", (e) => {
  tracing = true;
  traceCanvas.setPointerCapture(e.pointerId);
  const [x, y] = canvasUnit(e);
  engine.touch(x, y);
  e.preventDefault();
});
traceCanvas.addEventListener("pointermove", (e) => {
  if (!tracing) return;
  const [x, y] = canvasUnit(e);
  engine.touch(x, y);
  renderPips();
  e.preventDefault();
});
traceCanvas.addEventListener("pointerup", () => { tracing = false; engine.touchEnd(); renderPips(); });
traceCanvas.addEventListener("pointercancel", () => { tracing = false; });

// ---------------------------------------------------------------- confetti
const confettiCanvas = $("confetti-canvas");
const cctx = confettiCanvas.getContext("2d");
function sizeConfetti() {
  const dpr = window.devicePixelRatio || 1;
  confettiCanvas.width = Math.round(innerWidth * dpr);
  confettiCanvas.height = Math.round(innerHeight * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const CONF_COLORS = ["#f2554f", "#f99933", "#ffcd3c", "#4ab877", "#4d8cf2", "#a86bf0", "#f073a6"];
function rnd(i, salt) {
  const v = Math.sin((i * 127 + salt * 311) * 12.9898) * 43758.5453;
  return v - Math.floor(v);
}
function drawConfetti(now) {
  const t = (now - celebrateStart) / 1000;
  cctx.clearRect(0, 0, innerWidth, innerHeight);
  if (t > 3.5) return;
  for (let i = 0; i < 60; i++) {
    const r1 = rnd(i, 1), r2 = rnd(i, 2), r3 = rnd(i, 3), r4 = rnd(i, 4);
    const tt = t - r4 * 0.8;
    if (tt <= 0) continue;
    const x = r1 * innerWidth + Math.sin(tt * (2 + r2 * 3)) * 30;
    const y = -20 + tt * (120 + r2 * 180);
    if (y > innerHeight + 20) continue;
    const size = 6 + r3 * 8;
    cctx.save();
    cctx.translate(x, y);
    cctx.rotate(tt * (2 + r3 * 5));
    cctx.globalAlpha = Math.min(1, (3.5 - t) / 0.6);
    cctx.fillStyle = CONF_COLORS[i % CONF_COLORS.length];
    cctx.fillRect(-size / 2, -size / 3, size, size * 0.66);
    cctx.restore();
  }
}

// ---------------------------------------------------------------- main loop
function loop(now) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((now - lastT) / 1000 || 0, 0.05);
  lastT = now;
  if (engine) {
    const hadDemo = !!engine.demo;
    engine.tickDemo(dt);
    drawTrace(now);
    if (hadDemo && !engine.demo) { /* demo just ended */ }
  }
  if ($("celebrate").classList.contains("active")) drawConfetti(now);
}
function startLoop() { lastT = 0; if (!rafId) rafId = requestAnimationFrame(loop); }
function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

// ---------------------------------------------------------------- doodle
const doodleCanvas = $("doodle-canvas");
const dctx = doodleCanvas.getContext("2d");
const DOODLE_COLORS = ["#f2554f", "#f99933", "#fdcc33", "#4ab877", "#4d8cf2", "#a86bf0", "#f073a6", "#59402f"];
let doodlePaths = [];
let doodleCurrent = null;
let doodleColor = DOODLE_COLORS[0];

function sizeDoodle() {
  const r = doodleCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  doodleCanvas.width = Math.round(r.width * dpr);
  doodleCanvas.height = Math.round(r.height * dpr);
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawDoodle();
}
function drawDoodle() {
  const r = doodleCanvas.getBoundingClientRect();
  dctx.clearRect(0, 0, r.width, r.height);
  dctx.lineCap = dctx.lineJoin = "round";
  dctx.lineWidth = 12;
  for (const p of doodlePaths.concat(doodleCurrent ? [doodleCurrent] : [])) {
    if (p.pts.length < 2) {
      dctx.fillStyle = p.color;
      dctx.beginPath();
      dctx.arc(p.pts[0][0], p.pts[0][1], 6, 0, 7);
      dctx.fill();
      continue;
    }
    dctx.strokeStyle = p.color;
    dctx.beginPath();
    dctx.moveTo(p.pts[0][0], p.pts[0][1]);
    for (let i = 1; i < p.pts.length; i++) dctx.lineTo(p.pts[i][0], p.pts[i][1]);
    dctx.stroke();
  }
}
function doodlePoint(e) {
  const r = doodleCanvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
doodleCanvas.addEventListener("pointerdown", (e) => {
  doodleCanvas.setPointerCapture(e.pointerId);
  doodleCurrent = { color: doodleColor, pts: [doodlePoint(e)] };
  drawDoodle();
  e.preventDefault();
});
doodleCanvas.addEventListener("pointermove", (e) => {
  if (!doodleCurrent) return;
  doodleCurrent.pts.push(doodlePoint(e));
  drawDoodle();
  e.preventDefault();
});
function endDoodle() {
  if (doodleCurrent) { doodlePaths.push(doodleCurrent); doodleCurrent = null; drawDoodle(); }
}
doodleCanvas.addEventListener("pointerup", endDoodle);
doodleCanvas.addEventListener("pointercancel", endDoodle);

const paletteWrap = $("doodle-palette");
DOODLE_COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "swatch" + (i === 0 ? " selected" : "");
  b.style.background = c;
  b.setAttribute("aria-label", "Crayon color " + (i + 1));
  b.addEventListener("click", () => {
    doodleColor = c;
    paletteWrap.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
    b.classList.add("selected");
  });
  paletteWrap.appendChild(b);
});
$("btn-undo").addEventListener("click", () => { doodlePaths.pop(); drawDoodle(); });
$("btn-clear").addEventListener("click", () => { doodlePaths = []; drawDoodle(); });
$("btn-doodle-back").addEventListener("click", () => { renderHome(); showScreen("home"); });

// ---------------------------------------------------------------- boot
renderHome();
</script>
